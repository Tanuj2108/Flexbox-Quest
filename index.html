<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="game-header">
       <h1> FlexBox Quest</h1>
       <div class="game-info">
            <div>Lives: 3</div>
            <div>Coins: 120</div>
            <div>Level: 1</div>
       </div>
       <div class ="game-action">
            <button type="button">pause</button>
            <button type="button">Menu</button>
       </div>
    </header>


    <main>
        <section class="game-area">
            <h2>Game Area</h2>
                <div class="scene-row scene-top">
                    <div class="player">Player</div>
                    <div class="star">Star</div>
                </div>

                <div class="platform">Platform</div>

                <div class="scene-row scene-bottom">
                    <div class="platform">Platform</div>
                    <div class="platform">Platform</div>
                </div>
        </section>  
        
        

        <section class="game-panels">
            <h2>Game Panels</h2>
                <div class="panel controls"><h3>Controls</h3>
                <div class="control-row"><button>↑</button></div>
                <div class="control-row">
                    <button type="button">←</button>
                    <button type="button">↓</button>
                    <button type="button">→</button>
                </div>
                <button class="jump-button" type="button">Jump</button>
                </div>


                <div class="panel inventory"><h3>Inventory</h3>
                    <div class="inventory-items">
                        <div class="item">Sword</div>
                        <div class="item">Shield</div>
                        <div class="item">Potion</div>
                        <div class="item">Key</div>
                    </div>
                </div>

                <div class="panel quest"><h3>Quest</h3>
                    <div class="collect">
               <span>Collect 3 stars</span>
                        <span>1/3</span>
                    </div>
                    <div class="find">
                        <span>find the golden key</span>
                        <span>0/1</span>
                    </div>
                    <div class="defeat">
                        <span>defeat the monster</span>
                        <span>0/1</span>
                    </div>

                </div>

        </section>
        
    </main>
    <footer>Thanks For Playing</footer>
</body>
</html>
